# Random Forest Configuration

random_forest_default:
  model_type: random_forest
  description: "Random Forest with balanced settings"
  n_estimators: 100
  max_depth: 10
  min_samples_split: 10
  min_samples_leaf: 5
  class_weight: balanced
  n_jobs: -1                # Use all cores
  random_state: 42

random_forest_deep:
  model_type: random_forest
  description: "Deeper Random Forest (more complex)"
  n_estimators: 200
  max_depth: 15
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: balanced
  n_jobs: -1
  random_state: 42

random_forest_shallow:
  model_type: random_forest
  description: "Shallow Random Forest (less overfitting)"
  n_estimators: 100
  max_depth: 5
  min_samples_split: 20
  min_samples_leaf: 10
  class_weight: balanced
  n_jobs: -1
  random_state: 42